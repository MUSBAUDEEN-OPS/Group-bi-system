<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Group BI Dashboard — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #0d0d0d;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .brand { color: #c9971f; font-weight: 700; }
    p { color: #c3c2b7; max-width: 320px; margin: 0; }
    button {
      margin-top: 12px;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #16233f;
      color: #fff;
      font-weight: 600;
      min-height: 44px;
    }
  </style>
</head>
<body>
  <h1>Group BI <span class="brand">Dashboard</span></h1>
  <p>You're offline. Reconnect to load the latest figures — this page will retry automatically once you're back online.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
